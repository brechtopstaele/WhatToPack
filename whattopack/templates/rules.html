
{% extends "base.html" %}
{% block title %}Rules — PackPal{% endblock %}
{% block content %}
<section class="card">
  <h2>Active Ruleset</h2>
  <p class="muted">Import a JSON rules file to redefine items, conditions and quantities. Export to share.</p>
  <div class="row">
    <form method="get" action="{{ url_for('rules.export_rules') }}"><button class="btn">Export current rules</button></form>
    <input id="rulesFile" type="file" accept="application/json" />
    <button class="btn btn-primary" onclick="importRules()">Import JSON</button>
  </div>
  <pre>{{ rules | tojson(indent=2) }}</pre>
</section>
{% endblock %}
{% block scripts %}
<script>
async function importRules(){
  const f = document.getElementById("rulesFile").files[0];
  if (!f) return alert("Pick a file first.");
  try {
    const txt = await f.text();
    const data = JSON.parse(txt);
    const res = await fetch("{{ url_for('rules.import_rules') }}", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(data)
    });
    if (!res.ok) { alert("Import failed"); return; }
    location.reload();
  } catch(e){ alert("Invalid JSON: " + e.message); }
}
</script>
{% endblock %}
