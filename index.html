
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PackPal — Travel Packing List</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --brand: #2563eb;
      --bg: #0b1020;
      --card: #111827;
      --muted: #9ca3af;
      --ok: #10b981;
      --danger: #ef4444;
      --ring: #3b82f6;
    }
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", sans-serif; background: var(--bg); color: #e5e7eb; }
    header { padding: 1.25rem; background: linear-gradient(90deg, #111827, #0f172a); border-bottom: 1px solid #1f2937; position: sticky; top: 0; z-index: 10; }
    h1 { margin: 0 0 .5rem 0; font-size: 1.5rem; letter-spacing: .2px; }
    .container { max-width: 960px; margin: 1rem auto; padding: 0 1rem; }
    .grid { display: grid; gap: 1rem; grid-template-columns: 1fr; }
    @media (min-width: 900px) { .grid { grid-template-columns: 1.2fr .8fr; } }
    .card { background: var(--card); border: 1px solid #1f2937; border-radius: 12px; padding: 1rem; }
    .row { display: flex; gap: .75rem; flex-wrap: wrap; }
    input, select, button, textarea {
      background: #0b1220; color: #e5e7eb; border: 1px solid #1f2937; border-radius: 10px; padding: .65rem .8rem;
      outline: none; transition: border-color .15s, box-shadow .15s;
    }
    input:focus, select:focus, button:focus, textarea:focus { border-color: var(--ring); box-shadow: 0 0 0 3px #1e3a8a55; }
    button { background: #0b1220; cursor: pointer; }
    .btn-primary { background: var(--brand); border-color: #1d4ed8; }
    .btn-ok { background: #064e3b; border-color: #065f46; }
    .btn-danger { background: #4c0519; border-color: #7f1d1d; }
    .muted { color: var(--muted); }
    .badge { background: #0b1220; border: 1px solid #1f2937; padding: .2rem .5rem; border-radius: 999px; font-size: .8rem; color: #9ca3af; }
    .section-title { display:flex; align-items:center; justify-content:space-between; margin: .25rem 0 .75rem; }
    .list { display: grid; gap: .5rem; }
    .item { display:flex; align-items:center; gap:.6rem; background:#0d1325; border:1px solid #1f2937; border-radius: 10px; padding:.5rem .6rem; }
    .item label { flex: 1; display:flex; align-items:center; gap:.5rem; }
    .item small { color: #9ca3af; }
    .item .right { display:flex; align-items:center; gap:.4rem; }
    .stats { display:flex; gap:.75rem; flex-wrap:wrap; }
    .stat { background:#0b1220; border:1px solid #1f2937; padding:.5rem .75rem; border-radius: 999px; }
    .category { margin-top: 1rem; }
    .progress { height: 8px; background: #0b1220; border:1px solid #1f2937; border-radius: 999px; overflow: hidden; }
    .progress > div { height: 100%; background: var(--ok); width: 0%; transition: width .2s ease; }
    .spacer { height: .5rem; }
    .footer { color:#9ca3af; font-size:.9rem; margin-top:1.5rem; }
  </style>
</head>
<body>
  <header>
    <h1>🧳 PackPal — Travel Packing List</h1>
    <div class="container">
      <div class="row">
        <input id="tripName" placeholder="Trip name (e.g., Japan 2026)" />
        <input id="destination" placeholder="Destination" />
        <input id="dateRange" placeholder="Dates (e.g., 12–20 Mar)" />
        <button class="btn-primary" id="saveTripBtn">Save Trip</button>
        <button id="clearTripBtn">Clear</button>
      </div>
      <div class="spacer"></div>
      <div class="progress"><div id="progressBar"></div></div>
      <div class="stats" id="statsRow"></div>
    </div>
  </header>

  <main class="container grid">
    <section class="card">
      <div class="section-title">
        <strong>Add Item</strong>
        <span class="badge" id="tripBadge">No trip saved</span>
      </div>
      <div class="row">
